# Postgres local para desarrollo.
#   docker compose up -d
#
# Usa el puerto 5433 del host a proposito: el 5432 casi siempre ya esta ocupado
# por otro Postgres instalado en la maquina (Odoo, pgAdmin, un proyecto viejo),
# y cuando eso pasa la app se conecta a la base equivocada y falla con
# "password authentication failed".
services:
  db:
    image: postgres:16-alpine
    container_name: caserita-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: caserita
      POSTGRES_PASSWORD: caserita
      POSTGRES_DB: caserita
    ports:
      - '5433:5432'
    volumes:
      - caserita-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U caserita']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  caserita-db:
